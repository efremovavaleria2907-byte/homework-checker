<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Домашка — проверка по PDF</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18202a;--muted:#667085;--line:#e4e7ec;--accent:#5b5bd6;--good:#14804a;--bad:#c93636}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}main{max-width:900px;margin:auto;padding:18px 14px 60px}h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:4px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #1018280a}.drop{display:block;border:2px dashed #c8ccd6;border-radius:16px;padding:18px;text-align:center;background:#fafbff;cursor:pointer}.drop input{display:block;width:100%;margin-top:10px}.drop strong{display:block;margin-bottom:5px}.status{font-size:13px;color:var(--muted);margin-top:8px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:650;cursor:pointer;background:#111827;color:white}.btn.secondary{background:#eef0ff;color:#30309b}.btn.ghost{background:#f2f4f7;color:#344054}.btn:disabled{opacity:.45;cursor:not-allowed}.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}.hidden{display:none!important}.qnav{display:flex;gap:7px;flex-wrap:wrap}.qnav button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:white;cursor:pointer}.qnav button.active{outline:2px solid var(--accent)}.qnav button.done{background:#e9f8ef;color:var(--good)}.qtext{white-space:pre-wrap;line-height:1.55;font-size:16px}.answer{width:100%;font-size:18px;padding:13px;border:1px solid #cfd4dc;border-radius:12px;margin-top:14px}.result{border-radius:14px;padding:14px;margin-top:12px}.good{background:#ecfdf3;color:#096c3c}.bad{background:#fff1f1;color:#9f1c1c}.solution{white-space:pre-wrap;line-height:1.55;margin-top:9px}.small{font-size:12px;color:var(--muted)}textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}.score{font-size:20px;font-weight:750}details summary{cursor:pointer;font-weight:700}@media(max-width:650px){.row .drop{width:100%}}
</style></head><body><main><div style="margin-bottom:16px"><h1>Домашка: PDF → задания → проверка</h1><div class="sub">Работает прямо в браузере телефона или компьютера. Файлы обрабатываются в браузере.</div></div>
<section class="card"><div class="row"><label class="drop" style="flex:1"><strong>1. Файл с заданиями</strong><span>Выбери PDF</span><input id="taskFile" type="file" accept=".pdf,application/pdf"><div id="taskName" class="status">Не выбран</div></label><label class="drop" style="flex:1"><strong>2. Файл с ответами и решениями</strong><span>Выбери PDF</span><input id="answerFile" type="file" accept=".pdf,application/pdf"><div id="answerName" class="status">Не выбран</div></label></div><div class="row" style="margin-top:12px"><button id="start" class="btn" disabled>Распознать файлы</button><button id="demo" class="btn secondary">Загрузить сохранённые данные</button></div><div id="ocrStatus" class="status"></div><div class="progress"><div id="bar" class="bar"></div></div></section>
<section id="editor" class="card hidden"><details><summary>Ключ ответов — можно проверить и исправить</summary><p class="small">Формат: один ответ на строку: номер: ответ</p><textarea id="keyText"></textarea><div class="row" style="margin-top:9px"><button id="applyKey" class="btn secondary">Применить ключ</button><span id="keyInfo" class="small"></span></div></details></section>
<section id="work" class="card hidden"><div class="row" style="justify-content:space-between"><div class="score" id="score">0 / 0</div><button id="reset" class="btn ghost">Сбросить ответы</button></div><div id="nav" class="qnav" style="margin-top:13px"></div><div id="question" style="margin-top:18px"></div><div class="row" style="margin-top:14px;justify-content:space-between"><button id="prev" class="btn ghost">← Предыдущее</button><button id="next" class="btn">Следующее →</button></div></section>
<section id="raw" class="card hidden"><details><summary>Текст распознавания</summary><textarea id="rawText"></textarea></details></section></main>
<script type="module">import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";window.pdfjsLib=pdfjsLib;</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id);let tasks=[],key={},current=0,userAnswers={},answerRaw="",taskRaw="";if(localStorage.getItem("pdfHomeworkState"))$("demo").disabled=false;
function check(){ $("start").disabled=!($("taskFile").files.length&&$("answerFile").files.length) }$("taskFile").addEventListener("change",e=>{$("taskName").textContent=e.target.files[0]?.name||"Не выбран";check()});$("answerFile").addEventListener("change",e=>{$("answerName").textContent=e.target.files[0]?.name||"Не выбран";check()});
async function ocrPdf(file,label,offset){let tries=0;while(!window.pdfjsLib&&tries<200){await new Promise(r=>setTimeout(r,50));tries++}if(!window.pdfjsLib)throw Error("Не удалось загрузить PDF.js. Проверь интернет-соединение.");const data=await file.arrayBuffer();const pdf=await window.pdfjsLib.getDocument({data}).promise;let all="";for(let i=1;i<=pdf.numPages;i++){const pct=offset+(i-1)/pdf.numPages*50;$("ocrStatus").textContent=label+": страница "+i+" из "+pdf.numPages+"…";$("bar").style.width=Math.max(1,pct)+"%";const page=await pdf.getPage(i),vp=page.getViewport({scale:1.8}),canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:ctx,viewport:vp}).promise;const r=await Tesseract.recognize(canvas,"rus+eng",{logger:m=>{if(m.status==="recognizing text")$("bar").style.width=Math.min(99,pct+m.progress*(50/pdf.numPages))+"%"}});all+="\n\n--- Страница "+i+" ---\n"+r.data.text}return all}
function norm(s){return(s||"").toLowerCase().replace(/ё/g,"е").replace(/[«»"'`]/g,"").replace(/\s+/g,"").replace(/[.,;:!?(){}\[\]]/g,"")}function answerMatch(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;if(a===b)return true;if(/^\d+$/.test(a)&&/^\d+$/.test(b))return a.replace(/^0+/g,"")===b.replace(/^0+/g,"");const na=parseFloat(a.replace(",",".").replace(/[^\d.+-]/g,"")),nb=parseFloat(b.replace(",",".").replace(/[^\d.+-]/g,""));return Number.isFinite(na)&&Number.isFinite(nb)&&na===nb}
function splitBlocks(text){const re=/Задание\s*(?:№|N|Nº)?\s*(\d{1,3})/gi,h=[];let m;while((m=re.exec(text)))h.push({n:+m[1],i:m.index});return h.map((x,i)=>({n:x.n,text:text.slice(x.i,i+1<h.length?h[i+1].i:text.length).trim()}))}function extractAnswer(b){const m=b.match(/(?:Правильный ответ|Верный ответ|Верные варианты|Ответ)\s*[:\-]?\s*([^\n]{1,100})/i);return m?m[1].trim():""}function extractSolution(b){const m=b.match(/\bРешение\s*[:\-]?\s*([\s\S]*)/i);return m?m[1].trim():""}
function build(){const tb=splitBlocks(taskRaw),ab=splitBlocks(answerRaw),am=new Map(ab.map(x=>[x.n,x]));tasks=tb.map(x=>{const a=am.get(x.n);return{n:x.n,text:x.text.replace(/^Задание[^\n]*\n?/i,"").trim(),answer:a?extractAnswer(a.text):"",solution:a?extractSolution(a.text):""}}).filter((x,i,a)=>a.findIndex(y=>y.n===x.n)===i).sort((a,b)=>a.n-b.n);key={};tasks.forEach(t=>{if(t.answer)key[t.n]=t.answer});$("keyText").value=Object.entries(key).map(([n,a])=>n+": "+a).join("\n");$("editor").classList.remove("hidden");$("work").classList.remove("hidden");$("raw").classList.remove("hidden");$("rawText").value=taskRaw+"\n\n===== ОТВЕТЫ =====\n"+answerRaw;current=0;renderNav();renderQuestion();updateScore();$("ocrStatus").textContent="Готово: найдено "+tasks.length+" заданий.";$("bar").style.width="100%"}
$("start").onclick=async()=>{try{$("start").disabled=true;$("ocrStatus").textContent="Подготовка…";taskRaw=await ocrPdf($("taskFile").files[0],"Задания",0);answerRaw=await ocrPdf($("answerFile").files[0],"Ответы",50);build()}catch(e){console.error(e);$("ocrStatus").textContent="Не удалось распознать PDF: "+e.message}finally{$("start").disabled=false;check()}};
$("applyKey").onclick=()=>{key={};$("keyText").value.split(/\n/).forEach(line=>{const m=line.match(/^\s*(\d+)\s*[:\-]\s*(.*?)\s*$/);if(m&&m[2])key[+m[1]]=m[2].trim()});$("keyInfo").textContent="Применено ответов: "+Object.keys(key).length;updateScore();renderQuestion()};function renderNav(){$("nav").innerHTML="";tasks.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t.n;b.className=(i===current?"active ":"")+(userAnswers[t.n]!==undefined?"done":"");b.onclick=()=>{current=i;renderNav();renderQuestion()};$("nav").appendChild(b)})}
function renderQuestion(){if(!tasks.length)return;const t=tasks[current],given=userAnswers[t.n]||"";$("question").innerHTML="<h2>Задание №"+t.n+"</h2>";const q=document.createElement("div");q.className="qtext";q.textContent=t.text;$("question").appendChild(q);const inp=document.createElement("input");inp.className="answer";inp.placeholder="Введите ответ…";inp.value=given;$("question").appendChild(inp);const btn=document.createElement("button");btn.className="btn";btn.style.marginTop="10px";btn.textContent="Проверить";$("question").appendChild(btn);const result=document.createElement("div");$("question").appendChild(result);const checkAns=()=>{const v=inp.value.trim();userAnswers[t.n]=v;const expected=key[t.n]||t.answer,ok=answerMatch(v,expected);localStorage.setItem("pdfHomeworkState",JSON.stringify({tasks,key,userAnswers,taskRaw,answerRaw}));result.className="result "+(ok?"good":"bad");result.innerHTML="<strong>"+(ok?"Верно!":"Неверно.")+"</strong><div>Правильный ответ: <b>"+(expected||"не найден — проверь ключ")+"</b></div>";if(t.solution){const s=document.createElement("div");s.className="solution";s.innerHTML="<b>Решение:</b><br>"+escapeHtml(t.solution);result.appendChild(s)}updateScore();renderNav()};btn.onclick=checkAns;inp.onkeydown=e=>{if(e.key==="Enter")checkAns()}}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}function updateScore(){const good=tasks.filter(t=>userAnswers[t.n]!==undefined&&answerMatch(userAnswers[t.n],key[t.n]||t.answer)).length;$("score").textContent=good+" / "+tasks.length}$("prev").onclick=()=>{if(current>0){current--;renderNav();renderQuestion()}};$("next").onclick=()=>{if(current<tasks.length-1){current++;renderNav();renderQuestion()}};$("reset").onclick=()=>{userAnswers={};localStorage.removeItem("pdfHomeworkState");renderNav();renderQuestion();updateScore()};$("demo").onclick=()=>{const s=localStorage.getItem("pdfHomeworkState");if(!s)return;const x=JSON.parse(s);tasks=x.tasks||[];key=x.key||{};userAnswers=x.userAnswers||{};taskRaw=x.taskRaw||"";answerRaw=x.answerRaw||"";$("keyText").value=Object.entries(key).map(([n,a])=>n+": "+a).join("\n");$("editor").classList.remove("hidden");$("work").classList.remove("hidden");$("raw").classList.remove("hidden");renderNav();renderQuestion();updateScore()};
</script></body></html>
